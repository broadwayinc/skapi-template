<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password | Skapi HTML Template</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.jsdelivr.net/npm/skapi-js@2.2.17/dist/skapi.js"></script>
    <script src="service.js"></script>
</head>

<body>
    <header>
        <nav aria-label="Breadcrumb">
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="account.html">User Account</a></li>
                <li aria-current="page">Change password</li>
            </ol>
        </nav>
    </header>

    <main>
        <h1>Change password</h1>
        <p>
            A logged in user changes their password with <code>skapi.changePassword()</code>.
            It takes the current password and the new one.
        </p>

        <!-- This page needs a logged in user (see LOGIN_REQUIRED in service.js). -->
        <form action="account.html" onsubmit="changePassword(event)">
            <label>
                Current password
                <input type="password" name="current_password" minlength="6" placeholder="At least 6 characters" required>
            </label>
            <label>
                New password
                <input type="password" name="new_password" minlength="6" placeholder="At least 6 characters" required>
            </label>
            <button type="submit">Change password</button>
        </form>
    </main>

    <script>
        async function changePassword(event) {
            try {
                // On success Skapi redirects to the form's action (account.html).
                await skapi.changePassword(event);
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>

</html>
