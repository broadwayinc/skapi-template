<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password | Skapi HTML Template</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.jsdelivr.net/npm/skapi-js@2.2.17/dist/skapi.js"></script>
    <script src="service.js"></script>
</head>

<body>
    <header>
        <nav aria-label="Breadcrumb">
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="account.html">User Account</a></li>
                <li aria-current="page">Forgot password</li>
            </ol>
        </nav>
    </header>

    <main>
        <h1>Forgot password</h1>
        <p>
            <code>skapi.forgotPassword()</code> sends a 6 digit verification code to the account's email address.
            The next page takes the code and the new password.
        </p>
        <p>
            The code can only be sent to a verified email address.
        </p>

        <form onsubmit="requestPasswordReset(event)">
            <label>
                Email address
                <input type="email" name="email" placeholder="your@email.com" required>
            </label>
            <button type="submit">Send code</button>
        </form>
    </main>

    <script>
        async function requestPasswordReset(event) {
            event.preventDefault();
            let form = event.target;
            try {
                await skapi.forgotPassword(event);
                /*
                    The email address is passed to the next page in the URL hash,
                    so the visitor does not have to type it again.
                */
                location.href = pageUrl("reset-password.html#" + encodeURIComponent(form.elements.email.value));
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>

</html>
