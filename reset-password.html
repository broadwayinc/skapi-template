<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | Skapi HTML Template</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.jsdelivr.net/npm/skapi-js@2.2.21/dist/skapi.js"></script>
    <script src="service.js"></script>
</head>

<body>
    <header>
        <nav aria-label="Breadcrumb">
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="account.html">User Account</a></li>
                <li aria-current="page">Reset password</li>
            </ol>
        </nav>
    </header>

    <main>
        <h1>Reset password</h1>
        <p>
            <code>skapi.resetPassword()</code> sets a new password with the email address, the 6 digit code from the
            email and the new password. After a successful reset the login page is opened.
        </p>
        <p>
            If you have not received the code, check your spam folder or
            <button type="button" onclick="resendCode(this)">send it again</button>.
        </p>

        <form action="login.html" onsubmit="resetPassword(event)">
            <label>
                Email address
                <input type="email" name="email" placeholder="your@email.com" required>
            </label>
            <label>
                Verification code
                <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" title="The 6 digit code" placeholder="6 digit code" required>
            </label>
            <label>
                New password
                <input type="password" name="new_password" minlength="6" placeholder="At least 6 characters" required>
            </label>
            <button type="submit">Reset password</button>
        </form>
    </main>

    <script>
        /*
            forgot-password.html puts the email address in the URL hash.
            Fill the email field with it, so the visitor only has to type the code and the new password.
        */
        let emailInput = document.querySelector("input[name=email]");
        if (location.hash) {
            emailInput.value = decodeURIComponent(location.hash.slice(1));
        }

        async function resendCode(button) {
            let email = emailInput.value;
            if (!email) {
                alert("Enter your email address first.");
                return;
            }
            if (!confirm(`Send a new verification code to ${email}?`)) {
                return;
            }
            button.disabled = true;
            try {
                await skapi.forgotPassword({ email });
                alert("A new verification code has been sent.");
            } catch (err) {
                alert(err.message);
            } finally {
                button.disabled = false;
            }
        }

        async function resetPassword(event) {
            try {
                // On success Skapi redirects to the form's action (login.html).
                await skapi.resetPassword(event);
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>

</html>
